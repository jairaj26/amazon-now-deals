name: Amazon Now Deals Alert

on:
  schedule:
    # Runs at 1 minute past every hour
    - cron: '1 * * * *'

  workflow_dispatch:
    inputs:
      min_discount:
        description: 'Minimum Discount % threshold'
        required: false
        default: '70'
      dry_run:
        description: 'Dry run (test scrape without posting to Telegram)'
        required: false
        default: 'false'
        type: boolean

  repository_dispatch:
    types: [hourly_deals_scan, amazon_scan]

jobs:
  scrape-and-alert:
    name: Scrape Deals & Alert Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Restore Deals Cache
        uses: actions/cache/restore@v4
        with:
          path: data/posted_deals.json
          key: amazon-deals-cache-${{ github.run_id }}
          restore-keys: |
            amazon-deals-cache-

      - name: Run Amazon Now Deals Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AMAZON_COOKIE: ${{ secrets.AMAZON_COOKIE }}
          AMAZON_BRAND_ID: ${{ secrets.AMAZON_BRAND_ID }}
          MIN_DISCOUNT: ${{ github.event.client_payload.min_discount || inputs.min_discount || secrets.MIN_DISCOUNT || '70' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          CACHE_FILE: data/posted_deals.json
        run: |
          python -m bot.main

      - name: Save Deals Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/posted_deals.json
          key: amazon-deals-cache-${{ github.run_id }}-${{ github.run_attempt }}
